name: macOS Signed Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: macos-release-${{ github.ref }}
  # 公证提交开始后不主动取消，避免 Apple 仍在处理而 Runner 已被终止。
  cancel-in-progress: false

permissions:
  contents: read

env:
  DENO_VERSION: v2.8.3
  NOTARY_PROFILE: mediabrief-notary

jobs:
  build:
    name: Build unsigned Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend from current source
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip setuptools wheel
          venv/bin/python -m pip install -r requirements.txt

      - name: Prepare native release assets
        run: |
          brew install librsvg nasm pkg-config
          bash scripts/build_ffmpeg.sh
          bash scripts/fetch_deno.sh "$DENO_VERSION"

      - name: Verify backend import
        working-directory: backend
        run: ../venv/bin/python -c "import main; print('OK')"

      - name: Build MediaBrief.app
        run: bash scripts/build_macos.sh

      - name: Archive unsigned app for signing job
        run: |
          ditto -c -k --keepParent \
            dist/MediaBrief.app \
            "$RUNNER_TEMP/MediaBrief-unsigned.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mediabrief-unsigned-app
          path: ${{ runner.temp }}/MediaBrief-unsigned.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign-notarize:
    name: Sign, notarize and verify
    needs: build
    runs-on: macos-15
    timeout-minutes: 90
    # 在仓库设置中给这个 Environment 加 required reviewers，并把 Apple 凭据放在这里。
    environment: macos-release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mediabrief-unsigned-app
          path: ${{ runner.temp }}/mediabrief-unsigned

      - name: Restore unsigned app
        run: |
          mkdir -p dist
          ditto -x -k \
            "$RUNNER_TEMP/mediabrief-unsigned/MediaBrief-unsigned.zip" \
            dist
          test -d dist/MediaBrief.app

      - name: Verify tag matches bundle version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          bundle_version=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            dist/MediaBrief.app/Contents/Info.plist)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$bundle_version" != "$tag_version" ]; then
            echo "::error::Tag version $tag_version does not match bundle version $bundle_version"
            exit 1
          fi

      - name: Create temporary signing keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          for required in \
            CERTIFICATE_BASE64 \
            CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_PRIVATE_KEY_BASE64
          do
            if [ -z "${!required:-}" ]; then
              echo "::error::Required macos-release secret is missing: $required"
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/DeveloperID.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/mediabrief-release.keychain-db"

          printf '%s' "$CERTIFICATE_BASE64" | \
            base64 --decode -o "$certificate_path"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | \
            base64 --decode -o "$api_key_path"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 7200 "$keychain_path"
          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          identity_count=$(security find-identity -v -p codesigning "$keychain_path" | \
            grep -c 'Developer ID Application' || true)
          if [ "$identity_count" -ne 1 ]; then
            echo "::error::Expected exactly one Developer ID Application identity, found $identity_count"
            exit 1
          fi

          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$api_key_path" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID"

      - name: Sign, notarize, staple and verify distribution
        run: bash scripts/sign_and_package.sh notarize

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediabrief-macos-signed
          path: |
            dist/MediaBrief-*-macos-arm64.dmg
            dist/MediaBrief-*-macos-arm64-manifest.json
            dist/notary-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Attach verified artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            if ! gh release create "$tag" \
              --title "$tag" \
              --generate-notes; then
              # changelog 工作流可能刚好同时创建了同名 Release。
              sleep 5
              gh release view "$tag" >/dev/null
            fi
          fi

          release_files=(
            dist/MediaBrief-*-macos-arm64.dmg
            dist/MediaBrief-*-macos-arm64-manifest.json
          )
          gh release upload "$tag" "${release_files[@]}" --clobber

      - name: Remove temporary credentials
        if: always()
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/mediabrief-release.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/DeveloperID.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8
